# Copy to secret.yaml (do not commit it), fill in the values, then:
#   kubectl apply -n <namespace> -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: hf-secrets
type: Opaque
stringData:
  HF_API_KEY: your-api-key-id
  HF_API_SECRET: your-api-key-secret
  # Shared with the agents, e.g. from: openssl rand -hex 32
  HF_SERVER_TOKEN: change-me
  # Webhooks: set both or remove both (then the server polls).
  HF_PUBLIC_URL: https://hf.example.com
  HF_WEBHOOK_SECRET: whsec_from_the_higgsfield_console
  # Optional: cost limit per job for all agents.
  HF_MAX_USD: "0.50"
