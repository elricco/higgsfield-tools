# Quick start (see docs/server.md):
#   cp deploy/.env.example deploy/.env    # fill in the values
#   docker compose -f deploy/compose.yaml up -d
services:
  hf:
    image: ghcr.io/elricco/higgsfield-tools:0.3.0
    # Or build the image from this repository instead of pulling it:
    # build: ..
    env_file: .env
    environment:
      # The webhook gets its own port, so only 8081 needs to be reachable from the internet.
      HF_WEBHOOK_LISTEN: 0.0.0.0:8081
    ports:
      - "127.0.0.1:8080:8080" # API for your agents – not public
      # Webhook – for an HTTPS reverse proxy or tunnel on this machine. If the proxy runs elsewhere,
      # use "8081:8081" instead (the webhook only accepts signed deliveries either way).
      - "127.0.0.1:8081:8081"
    volumes:
      - hf-data:/data
    restart: unless-stopped

volumes:
  hf-data:
