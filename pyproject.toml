[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "higgsfield-tools"
version = "0.1.0"
description = "Lean CLI for the Higgsfield API (images and videos)"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Creates the command "hf", which calls hf.main().
[project.scripts]
hf = "hf:main"

[tool.setuptools]
# No package folders, just two single modules in the project folder.
py-modules = ["hf", "catalog"]
