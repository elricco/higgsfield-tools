[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "higgsfield-tools"
version = "0.1.0"
description = "Schlankes CLI für die Higgsfield-API (Bilder und Videos)"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Erzeugt den Befehl "hf", der hf.main() aufruft.
[project.scripts]
hf = "hf:main"

[tool.setuptools]
# Keine Paketordner, sondern zwei einzelne Module im Projektordner.
py-modules = ["hf", "catalog"]
