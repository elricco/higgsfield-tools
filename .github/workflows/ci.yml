# Runs on every push and pull request: lint, format check and tests.
# The tests need no network and no credentials (HTTP is replaced by a FakeSession).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version (requires-python) and the newest one.
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q

  # Builds the container image (without publishing it) and checks that the service starts.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t hf-test .
      - name: Smoke test
        run: |
          docker run --rm hf-test hf --help
          docker run -d --name hf -e HF_API_KEY=x -e HF_API_SECRET=y -e HF_SERVER_TOKEN=t -p 8080:8080 hf-test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/status)" = 401
          docker logs hf
          docker rm -f hf
      - name: Health check follows HF_LISTEN
        run: |
          docker run -d --name hf2 -e HF_API_KEY=x -e HF_API_SECRET=y -e HF_SERVER_TOKEN=t \
            -e HF_LISTEN=0.0.0.0:9090 --health-interval=2s --health-start-period=1s hf-test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hf2)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' hf2 | grep -qx healthy
          docker rm -f hf2
      - name: Validate Kubernetes examples
        run: |
          docker run --rm -v "$PWD/deploy/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary /manifests
