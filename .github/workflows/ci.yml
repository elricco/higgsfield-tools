# Runs on every push and pull request: lint, format check and tests.
# The tests need no network and no credentials (HTTP is replaced by a FakeSession).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version (requires-python) and the newest one.
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q
